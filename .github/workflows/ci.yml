name: Ric CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  core:
    name: core-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: CTest
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Ric doctor (Unix)
        if: runner.os != 'Windows'
        run: ./build/ric doctor .
      - name: Ric doctor (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ric = if (Test-Path 'build/Release/ric.exe') { 'build/Release/ric.exe' } else { 'build/ric.exe' }
          & $ric doctor .

  linux-native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/release_check.sh
