name: noqeri CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: noqeri-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: core-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Verify repository (Unix)
        if: runner.os != 'Windows'
        run: ./scripts/verify_repository.sh
      - name: Verify repository (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify_repository.ps1
      - name: Build through prerequisite-aware script (Unix)
        if: runner.os != 'Windows'
        run: ./scripts/build.sh
      - name: Build through prerequisite-aware script (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\build.ps1 -SkipInstall
      - name: CTest
        run: ctest --test-dir build -C Release --output-on-failure
      - name: noqeri doctor (Unix)
        if: runner.os != 'Windows'
        run: ./build/noqeri doctor .
      - name: noqeri doctor (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nq = if (Test-Path 'build/Release/noqeri.exe') { 'build/Release/noqeri.exe' } else { 'build/noqeri.exe' }
          & $nq doctor .

  ecosystem:
    name: libraries-registry-packages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Build current Noqeri compiler
        run: ./scripts/build.sh
      - name: Run complete local library smoke program
        run: ./build/noqeri run examples/ecosystem_smoke.nqr
      - name: Check out official Noqeri registry
        uses: actions/checkout@v7
        with:
          repository: EMN90909/noqeri-registry
          path: noqeri-registry
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Test registry service and package format
        working-directory: noqeri-registry
        run: |
          go test ./...
          go vet ./...
      - name: Compile every published registry package with this compiler
        working-directory: noqeri-registry
        run: ./scripts/verify_packages.sh "$GITHUB_WORKSPACE/build/noqeri"

  freestanding-native:
    name: freestanding-native
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Release and semantic checks
        run: ./scripts/release_check.sh
      - name: Compiler throughput benchmark
        run: sh ./scripts/benchmark.sh

  sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Configure ASan/UBSan
        run: cmake -S . -B build-sanitize -DCMAKE_BUILD_TYPE=Debug -DNOQERI_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build-sanitize --parallel
      - name: Test
        run: ctest --test-dir build-sanitize --output-on-failure
