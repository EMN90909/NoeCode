name: noqeri CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  core:
    name: core-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Verify repository (Unix)
        if: runner.os != 'Windows'
        run: ./scripts/verify_repository.sh
      - name: Verify repository (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify_repository.ps1
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: CTest
        run: ctest --test-dir build -C Release --output-on-failure
      - name: noqeri doctor (Unix)
        if: runner.os != 'Windows'
        run: ./build/noqeri doctor .
      - name: noqeri doctor (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $nq = if (Test-Path 'build/Release/noqeri.exe') { 'build/Release/noqeri.exe' } else { 'build/noqeri.exe' }
          & $nq doctor .

  freestanding-native:
    name: freestanding-native
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Release and semantic checks
        run: ./scripts/release_check.sh
      - name: Compiler throughput benchmark
        run: ./scripts/benchmark.sh

  sanitizers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure ASan/UBSan
        run: cmake -S . -B build-sanitize -DCMAKE_BUILD_TYPE=Debug -DNOQERI_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build-sanitize --parallel
      - name: Test
        run: ctest --test-dir build-sanitize --output-on-failure
